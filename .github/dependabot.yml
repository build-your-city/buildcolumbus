# Dependabot opens update PRs every Monday. CI runs on each one; nothing
# merges on its own.
version: 2
updates:
  # npm: all minor and patch updates arrive together in one weekly PR.
  # Major versions come as their own PRs, since they can need code changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  # GitHub Actions: workflows pin actions to commit SHAs, and Dependabot
  # bumps the SHA and its version comment together, in one weekly PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
